spring:
  datasource:
    url: jdbc:h2:mem:my-enterprise-project-test;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS pizzeria
    username:
    password:
    driverClassName: org.h2.Driver
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        hbm2ddl.auto: update
        database-platform: org.hibernate.dialect.H2Dialect
        default_schema: pizzeria
    defer-datasource-initialization: true
  sql:
    init:
      mode: embedded
logging:
  level:
    root: INFO
    org.springframework.test.context.cache: off