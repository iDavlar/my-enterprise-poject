<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<div style="color: red" th:if="${param.error}">
    Invalid username and password.
</div>
<form th:action="@{/login}" method="post">
    <label for="username">Login:
        <input id="username" type="text" name="username" placeholder="Enter login" th:value = ${username}>
    </label><br>
    <label for="password">Password:
        <input id="password" type="password" name="password" placeholder="Enter password" th:value = ${password}>
    </label><br>
    <button type="submit">Login</button>
</form>
<form action="/registration">
    <button type="submit">Registration</button>
</form>
</body>
</html>
